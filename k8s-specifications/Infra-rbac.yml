apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: otel-infra-role

rules:
- apiGroups: [""]
  resources:
    - nodes
    - nodes/proxy
    - pods
    - namespaces
  verbs:
    - get
    - list
    - watch
- apiGroups: ["apps"]
  resources:
    - replicasets
    - deployments
    - daemonsets
    - statefulsets
  verbs:
    - get
    - list
    - watch


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: otel-infra-binding

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-infra-role

subjects:
- kind: ServiceAccount
  name: default
  namespace: observability
