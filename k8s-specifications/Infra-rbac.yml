apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-collector
  namespace: observability

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-collector-role

rules:

# Kubernetes metadata
- apiGroups: [""]
  resources:
    - pods
    - namespaces
    - nodes
    - nodes/proxy
    - nodes/stats
  verbs:
    - get
    - list
    - watch

# Workload metadata
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - daemonsets
    - statefulsets
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-collector-binding

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-collector-role

subjects:
- kind: ServiceAccount
  name: infra-collector
  namespace: observability
