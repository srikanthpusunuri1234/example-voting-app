apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector

metadata:
  name: infra
  namespace: observability

spec:
  mode: daemonset

  serviceAccount: default

  image: otel/opentelemetry-collector-contrib:latest

  env:
    - name: KUBE_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP

  volumeMounts:

    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

    - name: varlogcontainers
      mountPath: /var/log/containers
      readOnly: true

  volumes:

    - name: varlogpods
      hostPath:
        path: /var/log/pods

    - name: varlogcontainers
      hostPath:
        path: /var/log/containers

  config:

    receivers:

      filelog:

        include:
          - /var/log/containers/*.log

        start_at: beginning

        include_file_path: true

      kubeletstats:

        collection_interval: 20s

        auth_type: serviceAccount

        endpoint: https://${env:KUBE_NODE_IP}:10250

        insecure_skip_verify: true

        metric_groups:
          - node
          - pod
          - container

      hostmetrics:

        collection_interval: 20s

        scrapers:

          cpu: {}

          memory: {}

          filesystem: {}

          network: {}

    processors:

      batch: {}

      k8sattributes:

        auth_type: serviceAccount

        passthrough: false

        extract:

          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name

    exporters:

      debug: {}

      prometheus:
        endpoint: "0.0.0.0:8889"

      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp

    service:

      pipelines:

        logs:

          receivers:
            - filelog

          processors:
            - k8sattributes
            - batch

          exporters:
            - debug
            - otlphttp/loki

        metrics:

          receivers:
            - kubeletstats
            - hostmetrics

          processors:
            - k8sattributes
            - batch

          exporters:
            - debug
            - prometheus
