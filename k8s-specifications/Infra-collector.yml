apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector

metadata:
  name: infra
  namespace: observability

spec:
  mode: daemonset

  serviceAccount: default

  image: otel/opentelemetry-collector-contrib:latest

  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true

  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers

  config:
    receivers:

      filelog:
        include:
          - /var/log/pods/*/*/*.log

        start_at: beginning

      kubeletstats:
        collection_interval: 20s

        auth_type: serviceAccount

        endpoint: https://${env:KUBE_NODE_NAME}:10250

        insecure_skip_verify: true

        metric_groups:
          - node
          - pod
          - container

      hostmetrics:
        collection_interval: 20s

        scrapers:
          cpu: {}
          memory: {}
          filesystem: {}
          network: {}

    processors:

      batch: {}

      k8sattributes:
        auth_type: serviceAccount

        passthrough: false

        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name

    exporters:

      debug: {}

      prometheus:
        endpoint: "0.0.0.0:8889"

      loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

    service:

      pipelines:

        logs:
          receivers:
            - filelog

          processors:
            - k8sattributes
            - batch

          exporters:
            - debug
            - loki

        metrics:
          receivers:
            - kubeletstats
            - hostmetrics

          processors:
            - k8sattributes
            - batch

          exporters:
            - debug
            - prometheus
