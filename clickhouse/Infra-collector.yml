apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: infra
  namespace: observability
spec:
  mode: daemonset
  serviceAccount: infra-collector
  image: otel/opentelemetry-collector-contrib:latest
  env:
    - name: KUBE_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlogcontainers
      mountPath: /var/log/containers
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      filelog:
        include:
          - /var/log/containers/*.log
        exclude:
          - /var/log/containers/infra-collector*.log
        start_at: beginning
        include_file_path: true
        operators: 
           - type: container
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: https://${env:KUBE_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
      hostmetrics:
        collection_interval: 20s
        scrapers:
          cpu: {}
          memory: {}
          filesystem: {}
          network: {}
          disk: {}
    processors:
      batch:
        send_batch_size: 10000
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
    exporters:
      otlp:
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, batch]
          exporters: [otlp]
        metrics:
          receivers: [kubeletstats, hostmetrics]
          processors: [batch]
          exporters: [otlp]