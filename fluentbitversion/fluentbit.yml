apiVersion: v1
kind: ServiceAccount

metadata:
  name: fluent-bit
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: fluent-bit

rules:

- apiGroups: [""]
  resources:
    - namespaces
    - pods
  verbs:
    - get
    - list
    - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: fluent-bit

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit

subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: fluent-bit
  namespace: observability

spec:

  selector:
    matchLabels:
      app: fluent-bit

  template:

    metadata:
      labels:
        app: fluent-bit

    spec:

      serviceAccountName: fluent-bit

      containers:

      - name: fluent-bit

        image: cr.fluentbit.io/fluent/fluent-bit:3.0

        volumeMounts:

        - name: config
          mountPath: /fluent-bit/etc

        - name: varlog
          mountPath: /var/log

        - name: containers
          mountPath: /var/log/containers
          readOnly: true

      volumes:

      - name: config
        configMap:
          name: fluent-bit-config

      - name: varlog
        hostPath:
          path: /var/log

      - name: containers
        hostPath:
          path: /var/log/containers
---   
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability

data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           1
        Daemon          Off
        Log_Level       info
        Parsers_File    parsers.conf

    [INPUT]
        Name            tail
        Path            /var/log/containers/*.log
        Tag             kube.*
        Parser          cri
        Refresh_Interval 5
        Mem_Buf_Limit   50MB
        Skip_Long_Lines On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name                loki
        Match               *
        Host                loki
        Port                3100

        Labels              job=fluent-bit

        label_keys          $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']

        Auto_Kubernetes_Labels Off

  parsers.conf: |
    [PARSER]
        Name         cri
        Format       regex
        Regex        ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%L%z