apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector

metadata:
  name: infra
  namespace: observability

spec:
  mode: daemonset

  serviceAccount: infra-collector

  image: otel/opentelemetry-collector-contrib:latest

  env:

    - name: KUBE_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP

  config:

    receivers:

      kubeletstats:

        collection_interval: 20s

        auth_type: serviceAccount

        endpoint: https://${env:KUBE_NODE_IP}:10250

        insecure_skip_verify: true

        metric_groups:
          - node
          - pod
          - container

      hostmetrics:

        collection_interval: 20s

        scrapers:

          cpu: {}

          memory: {}

          filesystem: {}

          network: {}

          disk: {}

    processors:

      batch: {}

      k8sattributes:

        auth_type: serviceAccount

        passthrough: false

        extract:

          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name

    exporters:

      debug:
        verbosity: detailed

      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true

    service:

      pipelines:

        metrics:

          receivers:
            - kubeletstats
            - hostmetrics

          processors:
            - batch

          exporters:
            - prometheus
            - debug